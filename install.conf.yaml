- defaults:
    link:
      relink: true
      create: true
    shell:
      stderr: true
      stdout: true
      stdin: true

- clean:
    - "~"
    - "~/.oh-my-zsh/custom/"
    - "~/.oh-my-zsh/custom/plugins/"

# Back up pre-existing real dotfiles (e.g. a stock ~/.zshenv) before linking.
- shell:
    - command: ./scripts/backup_dotfiles.zsh
      description: Backing up pre-existing dotfiles before linking

- link:
    ~/.claude/CLAUDE.md: claude/CLAUDE.md
    ~/.claude/settings.json: claude/settings.json
    ~/.claude/skills: claude/skills
    ~/.claude/themes: claude/themes
    ~/.claude/claude-notifications-go/config.json: claude/claude-notifications-go/config.json
    ~/.agents: .agents
    ~/.codex/config.toml: .config/codex/config.toml
    ~/.codex/AGENTS.md:
      path: .config/codex/AGENTS.md
    ~/.pi/agent/AGENTS.md: claude/CLAUDE.md
    ~/.pi/agent/settings.json: .config/pi/settings.json
    ~/.config/opencode/opencode.jsonc: .config/opencode/opencode.jsonc
    ~/.tmux.conf: .config/tmux/.tmux.conf
    ~/.ssh/config: .config/ssh/config
    ~/.hushlogin: hushlogin
    ~/.zshrc: zsh/zshrc
    ~/.zshenv: zsh/zshenv
    ~/.p10k.zsh: zsh/p10k.zsh
    ~/.actrc: .config/act/.actrc
    ~/.npmrc: .config/npm/npmrc
    ~/.config/pnpm/config.yaml: .config/pnpm/config.yaml
    ~/.config/git: .config/git
    ~/.config/kitty: .config/kitty
    ~/.config/gh: .config/gh
    ~/.config/yabai: .config/yabai
    ~/.config/skhd: .config/skhd
    ~/.config/herdr/config.toml: .config/herdr/config.toml
    ~/.config/herdr/plugins/config: .config/herdr/plugins/config
    ~/.config/herdr-automatic-rename: .config/herdr-automatic-rename
    ~/.config/worktrunk/config.toml: .config/worktrunk/config.toml
    ~/.config/hunk/config.toml: .config/hunk/config.toml
    ~/.config/tuicr/config.toml: .config/tuicr/config.toml
    ~/.config/slk/config.toml: .config/slk/config.toml
    ~/.config/chat-tui/config.json: .config/chat-tui/config.json
    ~/.config/mise/config.toml: .config/mise/config.toml
    ~/.config/nvim: .config/nvim
    ~/.config/aerospace: .config/aerospace
    ~/.config/omniwm/settings.toml: .config/omniwm/settings.toml
    ~/.config/tinycast/settings.json: .config/tinycast/settings.json
    ~/Documents/superwhisper/settings: .config/superwhisper/settings
    ~/Documents/superwhisper/modes: .config/superwhisper/modes
    ~/.config/karabiner: .config/karabiner
    ~/.config/ghostty: .config/ghostty
    ~/.config/cmux: .config/cmux
    ~/.config/lazygit: .config/lazygit
    ~/.config/bat: .config/bat
    ~/.config/television: .config/television
    ~/.config/atuin/config.toml: .config/atuin/config.toml
    ~/.vite-plus/config.json: .config/vite-plus/config.json
    ~/.hammerspoon:
      path: .config/hammerspoon
      force: true
    ~/.config/op/plugins.sh: .config/op/plugins.sh
    ~/Library/Application Support/Cursor/User/settings.json:
      cursor/Library/Application Support/Cursor/User/settings.json
    ~/Library/Application Support/Cursor/User/keybindings.json:
      cursor/Library/Application Support/Cursor/User/keybindings.json
    ~/Library/Application Support/Cursor/User/snippets:
      cursor/Library/Application Support/Cursor/User/snippets
    ~/Library/Application Support/Code/User/settings.json:
      vscode/Library/Application Support/Code/User/settings.json
    ~/Library/Application Support/Code/User/keybindings.json:
      vscode/Library/Application Support/Code/User/keybindings.json
    ~/Library/Application Support/Code/User/tasks.json:
      vscode/Library/Application Support/Code/User/tasks.json
    ~/Library/Application Support/Thaw/Profiles:
      thaw/Library/Application Support/Thaw/Profiles
    ~/.config/macos-defaults: .config/macos-defaults
    ~/.config/workmux: .config/workmux
    ~/.config/terminal-browser/extensions/vimium:
      path: ~/dev/pattobrien/vimium
      ignore-missing: true
    ~/.local/share/mise-completions-sync/registry.toml: .config/mise-completions-sync/registry.toml
    ~/.local/bin/herdr-gh-repos: scripts/herdr-gh-repos
    ~/.local/bin/herdr-jump-or-create: scripts/herdr-jump-or-create
    ~/.local/bin/herdr-quick-actions-popup: scripts/herdr-quick-actions-popup
    ~/.local/bin/herdr-sound: tools/scripts/src/herdr-sound.ts
    ~/.local/bin/hotspot: scripts/hotspot
    ~/.local/bin/claude-otel-headers: tools/scripts/src/claude-otel-headers.ts
    ~/.local/bin/tinycast-install: tools/scripts/src/tinycast-install.ts

- create:
    - ~/dev

- shell:
    # Make scripts executable
    - command: chmod +x scripts/*
      description: Making scripts executable
    # NOTE: tmux (TPM + plugins) is set up in the `essentials` step via
    # ./scripts/setup_tmux.zsh, because TPM's plugin installer needs the tmux
    # binary, which isn't installed until then.
