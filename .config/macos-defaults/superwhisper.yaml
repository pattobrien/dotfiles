# superwhisper settings (curated from exports/superwhisper.yaml)
# Apply with: macos-defaults apply ~/.config/macos-defaults/superwhisper.yaml
#
# Not included here:
# - modes/vocabulary: ~/Documents/superwhisper (symlinked via install.conf.yaml)
# - license: activate in-app
# - Sparkle updater state, window frames, cached model catalog: machine state
---
description: superwhisper settings
sudo: false
current_host: false
kill: [superwhisper]
data:
  com.superduper.superwhisper:
    # --- Hotkey: Ctrl+Opt+Cmd+Fn (carbon key code 63 = Fn) ---
    KeyboardShortcuts_toggleRecording: '{"carbonModifiers":6400,"carbonKeyCode":63,"mouseButtonNumbers":[]}'
    # --- Modes ---
    activeModeKey: default
    lastSelectedModeKey: pro
    # --- Recorder UI ---
    alwaysShowMiniRecorder: true
    recordingViewEnabled: true
    recordingViewCoordinateX: 544
    recordingViewCoordinateY: 459
    snapPointID: 10
    soundEffectTheme: classic
    # --- Audio ---
    useDefaultAudioDevice: true
    selectedDeviceID: ""
    # Duck (lower) other audio while recording
    defaultPlaybackBehavior: duck
    # --- App behavior ---
    launchOnLogin: true
    appFolderDirectory: /Users/patt/Documents
    SUEnableAutomaticChecks: false
    # --- Suppress onboarding / first-run hints ---
    completedOnboarding: true
    hasLaunchedBefore: true
    onboardingProgress: 5
    dismissedOnboardingToasts: "modes.activation,modes.create,vocabulary.firstItem,vocabulary.firstReplacement"
    pushToTalkMigrated: true
