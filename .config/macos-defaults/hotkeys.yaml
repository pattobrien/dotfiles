# Keyboard hotkey settings
# Apply with: macos-defaults apply ~/.config/macos-defaults/hotkeys.yaml

# Hotkey parameter format: [ascii_code, virtual_keycode, modifier_flags]
# Modifier flags: 262144=Ctrl, 524288=Fn, 1048576=Cmd, 1572864=Cmd+Option, 786432=Ctrl+Option
# Virtual keycode 49 = Space
description: Keyboard hotkey settings
sudo: false
current_host: false
kill:
  - cfprefsd
data:
  com.apple.symbolichotkeys:
    # Spotlight and input source shortcuts (disabled for Raycast)
    AppleSymbolicHotKeys:
      "64":
        # Show Spotlight search (Cmd+Space) - disabled for Raycast
        enabled: false
        value:
          type: standard
          parameters:
            - 65535
            - 49
            - 1048576
      "65":
        # Show Finder search window (Cmd+Option+Space) - disabled
        enabled: false
        value:
          type: standard
          parameters:
            - 65535
            - 49
            - 1572864
      "60":
        # Select previous input source (Ctrl+Space) - disabled
        enabled: false
        value:
          type: standard
          parameters:
            - 32
            - 49
            - 262144
      "61":
        # Select next input source (Ctrl+Option+Space) - disabled
        value:
          type: standard
          parameters:
            - 32
            - 49
            - 786432
        enabled: false
      # Built-in screenshot shortcuts (disabled so Shottr owns Cmd+Shift+3/4).
      # Cmd+Shift+5 (id 184) stays enabled as the built-in fallback.
      "28":
        # Save picture of screen as file (Cmd+Shift+3) - disabled for Shottr
        enabled: false
        value:
          type: standard
          parameters:
            - 51
            - 20
            - 1179648
      "29":
        # Copy picture of screen to clipboard (Ctrl+Cmd+Shift+3) - disabled
        enabled: false
        value:
          type: standard
          parameters:
            - 51
            - 20
            - 1441792
      "30":
        # Save picture of selected area (Cmd+Shift+4) - disabled for Shottr
        enabled: false
        value:
          type: standard
          parameters:
            - 52
            - 21
            - 1179648
      "31":
        # Copy selected area to clipboard (Ctrl+Cmd+Shift+4) - disabled
        enabled: false
        value:
          type: standard
          parameters:
            - 52
            - 21
            - 1441792
      # Mission Control and Spaces shortcuts.
      "32":
        # Mission Control (Ctrl+Up)
        enabled: true
        value:
          type: standard
          parameters:
            - 65535
            - 126
            - 8650752
      "34":
        # Mission Control (Ctrl+Shift+Up)
        enabled: true
        value:
          type: standard
          parameters:
            - 65535
            - 126
            - 8781824
      "33":
        # Application windows (Ctrl+Down)
        enabled: true
        value:
          type: standard
          parameters:
            - 65535
            - 125
            - 8650752
      "35":
        # Application windows (Ctrl+Shift+Down)
        enabled: true
        value:
          type: standard
          parameters:
            - 65535
            - 125
            - 8781824
      "79":
        # Move left a space (Ctrl+Left)
        enabled: true
        value:
          type: standard
          parameters:
            - 65535
            - 123
            - 8650752
      "80":
        # Move left a space (Ctrl+Shift+Left)
        enabled: true
        value:
          type: standard
          parameters:
            - 65535
            - 123
            - 8781824
      "81":
        # Move right a space (Ctrl+Right)
        enabled: true
        value:
          type: standard
          parameters:
            - 65535
            - 124
            - 8650752
      "82":
        # Move right a space (Ctrl+Shift+Right)
        enabled: true
        value:
          type: standard
          parameters:
            - 65535
            - 124
            - 8781824
      "118":
        # Switch to Desktop 1 (Ctrl+1)
        enabled: true
        value:
          type: standard
          parameters:
            - 65535
            - 18
            - 262144
      "119":
        # Switch to Desktop 2 (Ctrl+2)
        enabled: true
        value:
          type: standard
          parameters:
            - 65535
            - 19
            - 262144
      "120":
        # Switch to Desktop 3 (Ctrl+3)
        enabled: true
        value:
          type: standard
          parameters:
            - 65535
            - 20
            - 262144
      "121":
        # Switch to Desktop 4 (Ctrl+4)
        enabled: true
        value:
          type: standard
          parameters:
            - 65535
            - 21
            - 262144
      "122":
        # Switch to Desktop 5 (Ctrl+5)
        enabled: true
        value:
          type: standard
          parameters:
            - 65535
            - 23
            - 262144
      "123":
        # Switch to Desktop 6 (Ctrl+6)
        enabled: true
        value:
          type: standard
          parameters:
            - 65535
            - 22
            - 262144
      "124":
        # Switch to Desktop 7 (Ctrl+7)
        enabled: true
        value:
          type: standard
          parameters:
            - 65535
            - 26
            - 262144
      "125":
        # Switch to Desktop 8 (Ctrl+8)
        enabled: true
        value:
          type: standard
          parameters:
            - 65535
