name = "Neovim: PR Diff — ⌘ D"
description = "Focus the workspace's diff tab, or open the current branch's PR in nvim (atlas)"
type = "command"
command = '''
ws={{.WorkspaceId}}
tab=$(herdr pane list --workspace "$ws" | jq -r 'first(.result.panes[] | select(.tokens.layout == "diff") | .tab_id)')
[ -z "$tab" ] && tab=$(herdr tab list --workspace "$ws" | jq -r 'first(.result.tabs[] | select(.label == "diff") | .tab_id)')
if [ -z "$tab" ]; then
  cwd=$(herdr workspace get "$ws" | jq -r '.result.workspace.worktree.checkout_path // empty')
  new=$(herdr tab create --workspace "$ws" ${cwd:+--cwd "$cwd"} --label diff --no-focus)
  tab=$(echo "$new" | jq -r .result.tab.tab_id)
  pane=$(echo "$new" | jq -r .result.root_pane.pane_id)
  herdr pane report-metadata "$pane" --source layouts --token layout=diff
  herdr pane run "$pane" "nvim +AtlasPr; exit"
fi
herdr tab focus "$tab"
'''
