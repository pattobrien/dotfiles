name = "Codex: New Session"
description = "Start a fresh codex in a new tab of this workspace"
type = "command"
command = '''
new=$(herdr tab create --workspace {{.WorkspaceId}} --label codex --no-focus)
pane=$(echo "$new" | jq -r .result.root_pane.pane_id)
herdr pane wait-output "$pane" --regex '\S' --source visible --timeout 5000 >/dev/null 2>&1 || true
herdr pane run "$pane" "codex; exit"
herdr tab focus "$(echo "$new" | jq -r .result.tab.tab_id)"
'''
