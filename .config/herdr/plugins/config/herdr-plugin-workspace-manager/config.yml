# yaml-language-server: $schema=https://raw.githubusercontent.com/razajamil/herdr-plugin-workspace-manager/main/schema.json
# herdr-plugin-workspace-manager — applied automatically when a worktree is
# created. Mirrors the old workmux windows template: a focused claude agent
# plus a background `pnpm install` tab. Agent panes drop Remote Control,
# telemetry and the claude.ai connectors: an idle worker then holds ~1 TCP
# connection instead of 23, and the public CGNAT gateway blackholes the Mac
# once it passes roughly 600-850 flows.

layouts:
  - id: default
    tabs:
      - title: agent
        panes:
          - title: claude
            agent: claude
            env:
              CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: 1
              ENABLE_CLAUDEAI_MCP_SERVERS: false
      - title: install
        panes:
          - title: install
            command: pnpm install

  # shed: the `ccp` alias (opus 5.5 1m) as the agent, plus an install tab that
  # closes itself once `pnpm install` exits.
  - id: shed
    tabs:
      - title: agent
        panes:
          - title: ccp
            agent: claude
            agentArgs:
              - --model
              - claude-opus-5-5[1m]
            env:
              CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: 1
              ENABLE_CLAUDEAI_MCP_SERVERS: false
      - title: install
        panes:
          - title: install
            command: pnpm install
            persist: false

# Catch-all: every Herdr/worktrunk worktree lives under ~/.herdr/worktrees,
# so a path prefix match applies the default layout to all of them.
# Add `repo:` entries above this one for per-project layouts.
workspaces:
  - repo: shed
    defaultLayout: shed
  - path: ~/.herdr/worktrees
    defaultLayout: default
