id = "workspace-frecency"
name = "Workspace Frecency"
version = "0.3.0"
min_herdr_version = "0.9.0"
description = "Record each workspace focus as one JSON file per item under the plugin state dir: every label in workspaces/ (Cmd+O, Cmd+Shift+;), linked worktree branches in worktrees/ (Cmd+B)."
platforms = ["macos", "linux"]

[[events]]
on = "workspace.focused"
command = ["node", "record.ts"]
