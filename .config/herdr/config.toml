# Workspace jumps on the Cmd+Shift relay (Cmd+Shift+; / D / N → ctrl+F5/F6/F7;
# same roles as the old tmux switch-client bindings). `recent` toggles to the
# last project (dotfiles and notes included): the most recent open, unfocused
# label in the workspaces/ files of the workspace-frecency plugin's state dir.
[[keys.command]]
key = "ctrl+f5"
type = "shell"
command = '''
recent=$(jq -rn '[inputs] | sort_by(-.lastFocused) | .[].item' "$XDG_STATE_HOME"/herdr/plugins/workspace-frecency/workspaces/*.json)
herdr workspace focus "$(herdr workspace list | jq -r --arg recent "$recent" '.result.workspaces as $ws | first($recent | split("\n")[] as $l | $ws[] | select(.label == $l and .focused != true) | .workspace_id)')"
'''
description = "workspace: last project" # Cmd+Shift+;

[[keys.command]]
key = "ctrl+f6"
type = "shell"
command = '''
herdr workspace focus "$(herdr workspace list | jq -r 'first(.result.workspaces[] | select(.label == "dotfiles") | .workspace_id)')"
'''
description = "workspace: dotfiles" # Cmd+Shift+D

[[keys.command]]
key = "ctrl+f7"
type = "shell"
command = '''
herdr workspace focus "$(herdr workspace list | jq -r 'first(.result.workspaces[] | select(.label == "notes") | .workspace_id)')"
'''
description = "workspace: notes" # Cmd+Shift+N

