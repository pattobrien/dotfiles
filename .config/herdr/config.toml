# Pickers on the Cmd relay (Cmd+O → shift+F10, Cmd+Shift+P → shift+F11 — sent
# by kitty/ghostty; herdr only sees modified F-keys past F12, hence the
# shift+F slots). Cmd+O is the shed plugin's OpenTUI workspace picker.
[[keys.command]]
key = "shift+f10"
type = "plugin_action"
command = "shed.workspaces-open"
description = "workspace: open" # Cmd+O

# Cmd+B → ctrl+F8: the "Herdr: Open Worktree" quick action's list, same gum look.
# Rows are ordered by branch frecency from the worktrees/ files the
# workspace-frecency plugin writes to its state dir (never focused ones last).
[[keys.command]]
key = "ctrl+f8"
type = "popup"
command = '''
ws=$HERDR_ACTIVE_WORKSPACE_ID
frecent=$(jq -rn '[inputs] | sort_by(-.frecency) | .[].item' "$XDG_STATE_HOME"/herdr/plugins/workspace-frecency/worktrees/*.json)
list=$(herdr worktree list --workspace "$ws" | jq -r --arg ws "$ws" --arg frecent "$frecent" '($frecent | split("\n")) as $rank | [.result.worktrees[] | select(.open_workspace_id and .open_workspace_id != $ws)] | sort_by(.branch as $b | ($rank | index($b)) // ($rank | length)) | .[] | [.open_workspace_id, (.branch // .path)] | @tsv')
[ -z "$list" ] && list=$(printf '\tno other open worktrees')
n=$(printf '%s\n' "$list" | wc -l); [ "$n" -gt 12 ] && n=12
pick=$(printf '%s\n' "$list" | cut -f2 |
gum filter --height $((n + 7)) --padding '1 1' \
  --header 'Herdr: Open Worktree — ⌘ B' --header.foreground '#11111B' --header.background '#A78BFA' --header.bold --header.padding '0 1' --header.margin '0 0 1 0' \
  --prompt '❯ ' --prompt.foreground 5 --prompt.bold --placeholder 'Pick an option…' --placeholder.foreground 8 \
  --indicator '▌' --indicator.foreground 5 --cursor-text.bold --match.foreground 3 --match.bold)
id=$(printf '%s\n' "$list" | awk -F'\t' -v p="$pick" '$2 == p { print $1; exit }')
[ -n "$id" ] && herdr workspace focus "$id"
'''
width = 70
height = 20
description = "worktree: open" # Cmd+B

