# Open-or-create tab layouts. Each new pane is tagged `layout=<name>` with
# `herdr pane report-metadata`, and later presses find it by that token (tab
# label as the fallback, since tokens don't survive a server restart). Ported
# from the old tmux jump-or-create bindings — same slots, same muscle memory.
# Also exposed as herdr-plus quick actions (Open Neovim / Open Agent / Dev
# Server / Open PR Diff).
[[keys.command]]
key = "f5"
type = "shell"
command = '''
ws=$HERDR_ACTIVE_WORKSPACE_ID
tab=$(herdr pane list --workspace "$ws" | jq -r 'first(.result.panes[] | select(.tokens.layout == "claude" or .agent == "claude") | .tab_id)')
[ -z "$tab" ] && tab=$(herdr tab list --workspace "$ws" | jq -r 'first(.result.tabs[] | select(.label == "claude") | .tab_id)')
if [ -z "$tab" ]; then
  cwd=$(herdr workspace get "$ws" | jq -r '.result.workspace.worktree.checkout_path // empty')
  new=$(herdr tab create --workspace "$ws" ${cwd:+--cwd "$cwd"} --label claude --no-focus)
  tab=$(echo "$new" | jq -r .result.tab.tab_id)
  pane=$(echo "$new" | jq -r .result.root_pane.pane_id)
  herdr pane report-metadata "$pane" --source layouts --token layout=claude
  herdr pane run "$pane" "claude; exit"
fi
herdr tab focus "$tab"
'''
description = "claude: open or create" # Cmd+A

[[keys.command]]
key = "shift+f9"
