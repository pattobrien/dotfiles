command = '''
ws=$HERDR_ACTIVE_WORKSPACE_ID
tab=$(herdr pane list --workspace "$ws" | jq -r 'first(.result.panes[] | select(.tokens.layout == "nvim") | .tab_id)')
[ -z "$tab" ] && tab=$(herdr tab list --workspace "$ws" | jq -r 'first(.result.tabs[] | select(.label == "nvim") | .tab_id)')
if [ -z "$tab" ]; then
  cwd=$(herdr workspace get "$ws" | jq -r '.result.workspace.worktree.checkout_path // empty')
  new=$(herdr tab create --workspace "$ws" ${cwd:+--cwd "$cwd"} --label nvim --env HERDR_SHELL_EXEC=nvim --no-focus)
  tab=$(echo "$new" | jq -r .result.tab.tab_id)
  pane=$(echo "$new" | jq -r .result.root_pane.pane_id)
  herdr pane report-metadata "$pane" --source layouts --token layout=nvim
fi
herdr tab focus "$tab"
'''
description = "nvim: open or create" # Cmd+N

