name: dev-infra

services:
  postgres:
    image: docker.io/postgres:18
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${HOME}/.local/share/dev-infra/postgres:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:26.5
    restart: unless-stopped
    user: "101:101"
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    environment:
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: default
    volumes:
      - ${HOME}/.local/share/dev-infra/clickhouse/data:/var/lib/clickhouse
      - ${HOME}/.local/share/dev-infra/clickhouse/logs:/var/log/clickhouse-server
      - ./clickhouse/low-resources.xml:/etc/clickhouse-server/config.d/low-resources.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user clickhouse --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/redis:8
    restart: unless-stopped
    command: >
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - ${HOME}/.local/share/dev-infra/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse /data/pulumi && minio server /data --address ":9000"'
    ports:
      - "127.0.0.1:9100:9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ${HOME}/.local/share/dev-infra/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.157.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      clickhouse:
        condition: service_healthy

  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:4
    restart: unless-stopped
    ports:
      - "127.0.0.1:3030:3030"
    environment: &langfuse-env
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_AUTH: ${REDIS_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: "true"
      LANGFUSE_S3_BATCH_EXPORT_BUCKET: langfuse
      LANGFUSE_S3_BATCH_EXPORT_REGION: auto
      LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_BATCH_EXPORT_ENDPOINT: http://minio:9000
      LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_BATCH_EXPORT_PREFIX: exports/
    depends_on: &langfuse-deps
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  langfuse-web:
    image: docker.io/langfuse/langfuse:4
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      <<: *langfuse-env
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      LANGFUSE_INIT_ORG_ID: patt
      LANGFUSE_INIT_ORG_NAME: Patt
      LANGFUSE_INIT_PROJECT_ID: platform
      LANGFUSE_INIT_PROJECT_NAME: Platform
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_USER_EMAIL}
      LANGFUSE_INIT_USER_NAME: Patt O'Brien
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_USER_PASSWORD}
    depends_on: *langfuse-deps

  op-connect-api:
    image: docker.io/1password/connect-api:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - ${HOME}/.local/share/dev-infra/op-connect/1password-credentials.json:/home/opuser/.op/1password-credentials.json:ro
      - ${HOME}/.local/share/dev-infra/op-connect/data:/home/opuser/.op/data

  op-connect-sync:
    image: docker.io/1password/connect-sync:latest
    restart: unless-stopped
    volumes:
      - ${HOME}/.local/share/dev-infra/op-connect/1password-credentials.json:/home/opuser/.op/1password-credentials.json:ro
      - ${HOME}/.local/share/dev-infra/op-connect/data:/home/opuser/.op/data

  openbao:
    image: docker.io/openbao/openbao:2.6
    restart: unless-stopped
    command: ["server"]
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - ./openbao.hcl:/openbao/config/openbao.hcl:ro
      - ${HOME}/.local/share/dev-infra/openbao:/openbao/data

  mongo:
    image: docker.io/mongo:8
    restart: unless-stopped
    volumes:
      - ${HOME}/.local/share/dev-infra/mongo:/data/db

  hyperdx:
    image: docker.hyperdx.io/hyperdx/hyperdx:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      MONGO_URI: mongodb://mongo:27017/hyperdx
      DEFAULT_CONNECTIONS: '[{"name":"Default","host":"http://clickhouse:8123","username":"clickhouse","password":"${CLICKHOUSE_PASSWORD}"}]'
      DEFAULT_SOURCES: '[{"from":{"databaseName":"otel","tableName":"otel_logs"},"kind":"log","name":"Logs","connection":"Default","timestampValueExpression":"Timestamp","displayedTimestampValueExpression":"Timestamp","implicitColumnExpression":"Body","serviceNameExpression":"ServiceName","bodyExpression":"Body","eventAttributesExpression":"LogAttributes","resourceAttributesExpression":"ResourceAttributes","defaultTableSelectExpression":"Timestamp,ServiceName,SeverityText,Body","severityTextExpression":"SeverityText","traceIdExpression":"TraceId","spanIdExpression":"SpanId","traceSourceId":"Traces","sessionSourceId":"Sessions"},{"from":{"databaseName":"otel","tableName":"otel_traces"},"kind":"trace","name":"Traces","connection":"Default","timestampValueExpression":"Timestamp","displayedTimestampValueExpression":"Timestamp","implicitColumnExpression":"SpanName","serviceNameExpression":"ServiceName","eventAttributesExpression":"SpanAttributes","resourceAttributesExpression":"ResourceAttributes","defaultTableSelectExpression":"Timestamp,ServiceName,StatusCode,round(Duration/1e6),SpanName","traceIdExpression":"TraceId","spanIdExpression":"SpanId","durationExpression":"Duration","durationPrecision":9,"parentSpanIdExpression":"ParentSpanId","spanNameExpression":"SpanName","spanKindExpression":"SpanKind","statusCodeExpression":"StatusCode","statusMessageExpression":"StatusMessage","logSourceId":"Logs","sessionSourceId":"Sessions"},{"from":{"databaseName":"otel","tableName":"hyperdx_sessions"},"kind":"session","name":"Sessions","connection":"Default","timestampValueExpression":"Timestamp","displayedTimestampValueExpression":"Timestamp","implicitColumnExpression":"Body","bodyExpression":"Body","serviceNameExpression":"ServiceName","eventAttributesExpression":"LogAttributes","resourceAttributesExpression":"ResourceAttributes","severityTextExpression":"SeverityText","traceIdExpression":"TraceId","spanIdExpression":"SpanId","traceSourceId":"Traces","logSourceId":"Logs"}]'
    depends_on:
      - mongo
      - clickhouse

  caddy:
    build:
      context: ./caddy
    image: dev-infra/caddy-tailscale:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TS_AUTHKEY: ${TAILSCALE_AUTHKEY}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/conf.d:/etc/caddy/conf.d:ro
      - ${HOME}/.local/share/dev-infra/caddy-tailscale:/data/tailscale

  openpanel-api:
    image: docker.io/lindesvard/openpanel-api:2
    restart: unless-stopped
    command: >
      sh -c "CI=true pnpm -r run migrate:deploy && pnpm start"
    environment: &openpanel-env
      NODE_ENV: production
      SELF_HOSTED: "true"
      BATCH_SIZE: "5000"
      BATCH_INTERVAL: "10000"
      ALLOW_REGISTRATION: "false"
      ALLOW_INVITATION: "true"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/openpanel?schema=public
      DATABASE_URL_DIRECT: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/openpanel?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/3
      CLICKHOUSE_URL: http://clickhouse:${CLICKHOUSE_PASSWORD}@clickhouse:8123/openpanel
      DASHBOARD_URL: https://openpanel.tailc7bb96.ts.net
      API_URL: https://openpanel.tailc7bb96.ts.net/api
      API_URL_SSR: http://openpanel-api:3000
      COOKIE_SECRET: ${OPENPANEL_COOKIE_SECRET}
      CUSTOM_COOKIE_DOMAIN: .tailc7bb96.ts.net
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  openpanel-dashboard:
    image: ghcr.io/pattobrien/openpanel-dashboard:selfhost
    restart: unless-stopped
    environment: *openpanel-env
    depends_on:
      openpanel-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  openpanel-worker:
    image: docker.io/lindesvard/openpanel-worker:2
    restart: unless-stopped
    environment: *openpanel-env
    depends_on:
      openpanel-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
