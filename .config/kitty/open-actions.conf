# Ctrl+Shift+click on a file:// URL. Herdr's own Ctrl-click goes through the
# herdr-open-file plugin's link handler; this is the same script, for the clicks
# kitty handles itself (and for when no multiplexer is running).
protocol file
action launch --type=background /Users/patt/dev/pattobrien/shed/tools/herdr-open-file/bin/open-file.sh ${URL}
