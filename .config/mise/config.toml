[tools."github:voidzero-dev/vite-plus"]
version = "latest"
postinstall = '''
cd "$MISE_TOOL_INSTALL_PATH"
ln -sf vp vpr
ln -sf vp vpx
'''

[bootstrap.services.obsidian-sync-shed-skills]
scope = "user"
command = "/opt/homebrew/bin/mise exec npm:obsidian-headless -- ob sync --continuous --path /Users/patt/dev/pattobrien/shed/plugins/patt/skills"
restart = "always"
requires_tools = true

[hooks]
postinstall = [
  "misecompsync --new-only --shell zsh",
  "herdr integration install claude",
  "herdr integration install codex",
  "atuin hook install claude-code",
  "atuin hook install codex",
  "atuin hook install opencode",
  "atuin hook install pi",
  "pnpm add -g @pattobrien/shed-cli@latest",
]

[tasks.dotfiles]
description = "Navigate to dotfiles"
run = "cd ~/dev/pattobrien/dotfiles && exec $SHELL"

[tasks."codex:models"]
description = "Refresh the pinned Codex model catalog at ~/.codex/model-catalog.json"
run = '''
set -e
home="$(mktemp -d)"
ln -s "$HOME/.codex/auth.json" "$home/auth.json"
CODEX_HOME="$home" codex debug models > "$home/model-catalog.json"
mv "$home/model-catalog.json" "$HOME/.codex/model-catalog.json"
rm -rf "$home"
'''

[tasks."patch:vfox-pulumi"]
description = "Apply dotfiles/patches to the vfox-pulumi mise plugin (re-run after `mise plugins update`)"
run = '''
patch="$HOME/dev/pattobrien/dotfiles/patches/vfox-pulumi-config-root.patch"
repo="$HOME/.local/share/mise/plugins/vfox-pulumi"
if git -C "$repo" apply --reverse --check "$patch" 2>/dev/null; then
  echo "already applied"
else
  git -C "$repo" apply "$patch" && echo "applied"
fi
'''
