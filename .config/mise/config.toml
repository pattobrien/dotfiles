[settings]
npm.package_manager = "pnpm"
# native-preview only publishes daily dev builds, all younger than the default min release age
minimum_release_age_excludes = ["npm:@typescript/native-preview"]
experimental = true
idiomatic_version_file_enable_tools = ["node"]

[tools]
lua-language-server = "latest"
neovim = "0.12.2"
node = "24"
"npm:agent-browser" = "latest"
"npm:@ecrindigital/facet-cli" = "0.2"
"npm:@kitlangton/ghui" = "latest"
"npm:@kitlangton/stack" = "latest"
"npm:@nubjs/nub" = "latest"
"npm:@open-pencil/cli" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:@posthog/cli" = "latest"
"npm:@railway/cli" = "latest"
"npm:@typescript/native-preview" = "latest"
"npm:codemod" = "latest"
"npm:eas-cli" = "latest"
"npm:neonctl" = "latest"
"npm:odiff-bin" = "latest"
"npm:oxfmt" = "latest"
"npm:oxlint" = "latest"
"npm:turbo" = "latest"
"npm:vercel" = "latest"
# vite-plus (`vp`) is installed via Homebrew, not mise: the npm backend ships a
# broken CLI (missing `vp add` etc). See brew/personal/Brewfile.
pnpm = "11.9.0"
swift = "6.2.4"
sentry-cli = "latest"
# yarn = "latest"

# Language runtimes & SDKs (migrated from asdf .tool-versions)
bun = "1.3.14"
deno = "2.2.12"
python = "3.13.11"
ruby = "3.4.8"
go = "1.25.6"
rust = "1.93.0"
zig = "0.15.1"
dart = "3.10.8"
java = "24.0.1"
kotlin = "2.2.21"
scala = "3.7.2"
dotnet = "10.0.102"

# Build, packaging & language tooling
shfmt = "latest"        # shell/zsh formatter (zsh dialect since v3.13)
uv = "0.6.1"
gradle = "8.14.3"
maven = "3.9.12"
cmake = "4.2.1"
ninja = "1.13.2"
just = "1.46.0"
cocoapods = "1.16.2"

# Infra, Kubernetes & cloud
terraform = "1.14.3"
tflint = "0.60.0"
helm = "4.0.4"
kubectl = "1.35.0"
kustomize = "5.8.0"
kubectx = "0.9.5"
argocd = "3.2.3"
minikube = "1.37.0"
kind = "0.31.0"
kubebuilder = "4.10.1"
skaffold = "2.17.1"

# Docs & misc CLIs
"github:pattobrien/herdr" = "0.8.0-graphics.3"
"github:schpet/linear-cli" = { version = "latest", exe = "linear" }
"github:modem-dev/hunk" = "latest"
"github:agavra/tuicr" = "latest"
"github:gammons/slk" = "latest"
pandoc = "3.8.3"
typst = "0.14.2"
jq = "1.8.1"
protoc = "33.3"

[tasks.dotfiles]
description = "Navigate to dotfiles"
run = "cd ~/dev/pattobrien/dotfiles && exec $SHELL"
