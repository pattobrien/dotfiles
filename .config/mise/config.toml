[env]
# Fallbacks for pulumi provider repos (e.g. pulumi-cloudflare): their
# autogenerated .config/mise.toml templates these from a vfox-pulumi env hook,
# but mise skips env hooks when loading tracked configs from outside the repo
# (mise prune/upgrade/ls), which otherwise fails template rendering. Inside the
# repo the hook's go.mod-derived values override these.
GO_VERSION_MISE = "1.25.11"
PULUMI_VERSION_MISE = "3.253.0"
# AI_GATEWAY_API_KEY = { value = "{{ exec(command='doppler secrets get AI_GATEWAY_API_KEY --plain -p platform -c prd', cache_duration='1d') }}", tools = true }
# BROWSERLESS_TOKEN = { value = "{{ exec(command='doppler secrets get BROWSERLESS_TOKEN --plain -p platform -c prd', cache_duration='1d') }}", tools = true }
# BROWSERLESS_API_KEY = { value = "{{ exec(command='doppler secrets get BROWSERLESS_API_KEY --plain -p platform -c prd', cache_duration='1d') }}", tools = true }
# BROWSERBASE_API_KEY = { value = "{{ exec(command='doppler secrets get BROWSERBASE_API_KEY --plain -p platform -c prd', cache_duration='1d') }}", tools = true }
# KERNEL_API_KEY = { value = "{{ exec(command='doppler secrets get KERNEL_API_KEY --plain -p platform -c prd', cache_duration='1d') }}", tools = true }
GH_PKG_TOKEN = { value = "{{ exec(command='/opt/homebrew/bin/gh auth token', cache_duration='1d') }}", tools = true }

[settings]
npm.package_manager = "pnpm"
pipx.uvx = true
# native-preview only publishes daily dev builds, all younger than the default min release age
minimum_release_age_excludes = [
  "npm:@typescript/native-preview",
  "claude-code",
  "codex",
  "github:voidzero-dev/vite-plus",
  "github:pattobrien/herdr",
]
experimental = true
fetch_remote_versions_cache = "5m"
jobs = 32
idiomatic_version_file_enable_tools = ["node", "bun", "pnpm", "python", "go"]

[tools]
claude-code = "latest"
