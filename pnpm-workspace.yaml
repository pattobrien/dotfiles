packages:
  - tools/*
  - tests/*

allowBuilds:
  esbuild: true
  node-pty: true
  protobufjs: false

catalog:
  "@decimalturn/toml-patch": ^3.3.0
  "@modelcontextprotocol/sdk": ^1.32.1
  "@msgpack/msgpack": ^3.1.3
  "@opentelemetry/api": ^1.9.1
  "@opentelemetry/core": ^2.10.0
  "@opentelemetry/exporter-trace-otlp-proto": ^0.221.0
  "@opentelemetry/resources": ^2.10.0
  "@opentelemetry/sdk-node": ^0.221.0
  "@opentelemetry/sdk-trace": ^2.10.0
  "@pattobrien/herdr-ts-sdk": ^0.1.0
  "@termless/core": 0.8.4
  "@termless/ghostty": 0.8.4
  "@termless/kitty": 0.8.4
  "@termless/test": 0.8.4
  "@termless/xtermjs": 0.8.4
  "@types/node": ^26
  "@vitest/ui": 5.0.5
  "@xterm/headless": ^6.0.0
  "@xterm/xterm": ^6.0.0
  node-pty: ^1.1.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitest: 5.0.5
  zod: ^4

catalogMode: strict

minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@1.4.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.4.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.4.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.4.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.4.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.4.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.4.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.4.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.4.0"
  - vite-plus@1.4.0
  - "@pattobrien/herdr-ts-sdk@0.1.0"

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
