packages:
  - packages/*
  - tools/*
  - tests/*
  - claude-plugins/meagain/hooks
  - "!tools/picker"

allowBuilds:
  esbuild: true

catalog:
  "@msgpack/msgpack": ^3.1.3
  "@types/node": ^26
  oxfmt: ^0.57.0
  oxlint: ^1.72.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@^0.2.5
  vite-plus: ^0.2.5
  vitest: ^4.1.10
  zod: ^4

catalogMode: strict

overrides:
  vite: "catalog:"
  vitest: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
