packages:
  - tools/*
  - tests/*

allowBuilds:
  esbuild: true
  node-pty: true
  protobufjs: false

catalog:
  "@msgpack/msgpack": ^3.1.3
  '@opentelemetry/api': ^1.9.1
  '@opentelemetry/exporter-trace-otlp-proto': ^0.221.0
  '@opentelemetry/sdk-node': ^0.221.0
  "@termless/core": 0.8.4
  "@termless/ghostty": 0.8.4
  "@termless/kitty": 0.8.4
  "@termless/test": 0.8.4
  "@termless/xtermjs": 0.8.4
  "@types/node": ^26
  "@vitest/ui": 5.0.0-beta.7
  "@xterm/headless": ^6.0.0
  "@xterm/xterm": ^6.0.0
  node-pty: ^1.1.0
  oxfmt: ^0.57.0
  oxlint: ^1.72.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@^0.2.7
  vite-plus: ^0.2.7
  vitest: 5.0.0-beta.7
  zod: ^4

catalogMode: strict

overrides:
  vite: "catalog:"
  vitest: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
