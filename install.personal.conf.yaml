- defaults:
    link:
      relink: true
      create: true
    shell:
      stderr: true
      stdout: true
      stdin: true

- link:
    ~/.agent-browser/config.json: .config/agent-browser/config.json

- shell:
    - command: ./scripts/brew_bundle.zsh brew/personal/Brewfile
    - command: ./scripts/dequarantine.zsh
      description: Removing the quarantine flag from installed apps
    - command: ./scripts/relink-clis
      description: Linking CLIs from pattobrien repos (package.json bin)
